<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I FIT FORMULA SUPPLEMENT STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: #181818;
            border: 1px solid #d4af37;
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        .logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #d4af37;
            margin-bottom: 20px;
        }

        h1 {
            color: #d4af37;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .tagline {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .badge {
            display: inline-block;
            background-color: #d4af37;
            color: #000;
            font-weight: bold;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-card {
            background: #222;
            border-left: 4px solid #d4af37;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 20px;
        }

        .info-card h3 {
            color: #d4af37;
            font-size: 14px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .info-card p {
            font-size: 14px;
            color: #ddd;
            line-height: 1.5;
        }

        .btn-directions {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: #d4af37;
            border: 2px solid #d4af37;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-directions:hover {
            background-color: #d4af37;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Updated to match the exact filename in your repository -->
        <img src="ifitlogo.jpeg" alt="I Fit Formula Logo" class="logo">

        <h1>I FIT FORMULA SUPPLEMENT STORE</h1>
        <p class="tagline">Nutrition Store</p>

        <div class="badge">Online Store Coming Soon</div>

        <div class="info-card">
            <h3>Offline Store Status</h3>
            <p><strong>Open Daily:</strong> 9:30 AM – 9:30 PM</p>
        </div>

        <div class="info-card">
            <h3>Address</h3>
            <p>R K Hospital Kolar, 44QJ+J4M, MB Rd, Raja Nagar, Kolar, Karnataka 563101</p>
        </div>

        <a class="btn-directions" href="https://maps.google.com/?q=44QJ+J4M,+MB+Rd,+Raja+Nagar,+Kolar,+Karnataka+563101" target="_blank">Get Directions on Maps</a>
    </div>

</body>
</html>
